name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - if: matrix.node == 24
        run: |
          if ! bash scripts/check-runtime.sh > /tmp/ironfang-runtime.log 2>&1; then
            cat /tmp/ironfang-runtime.log
            cat /tmp/ironfang-runtime.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat /tmp/ironfang-runtime.log
