# Publishes to npm via Trusted Publishing (OIDC - no token secret): npmjs.com
# package settings must list this repo + workflow file as a trusted publisher.
# Provenance is attached automatically, which n8n's verified-community-node
# scanner requires. Trigger: push a tag like v0.1.1.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write # OIDC exchange with npm
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present
      - run: npm publish --access public
